server {
    listen 80;
    server_name app.yadhronics.com blog.yadhronics.com;

    # Redirect everything to HTTPS
    return 301 https://$host$request_uri;
}

# ============================================================
# app.yadhronics.com → backend on port 9000
# ============================================================
server {
    listen 443 ssl;
    server_name app.yadhronics.com;

    # SSL certs for app.yadhronics.com
    ssl_certificate     /etc/letsencrypt/live/admin.yadhronics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.yadhronics.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

